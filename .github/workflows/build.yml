# Build uae3DSng in the official devkitARM container. The goal for now is *diagnostics*: compile every file
# (make -k keeps going after the first error) and link the ELF. The .cia/.3ds/.smdh steps need bannertool and
# makerom, which are not in the image, so they are expected to fail at the very end and are ignored here.
name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check libraries (install only what is missing)
        run: |
          # The image normally ships everything; pkg.devkitpro.org sometimes answers 403 to CI runners, so do not hard-depend on it.
          for p in 3ds-dev 3ds-sdl_image 3ds-sdl_gfx 3ds-libpng 3ds-zlib 3ds-libjpeg-turbo; do
            if dkp-pacman -Q "$p" >/dev/null 2>&1; then echo "have $p"; continue; fi
            for t in 1 2 3; do dkp-pacman -Sy --noconfirm --needed "$p" && break || sleep 20; done
          done
          dkp-pacman -Q | grep -E '^(3ds-|libctru|citro|devkitARM|tex3ds)' || true

      - name: Build
        run: |
          set -o pipefail
          make release -k -j"$(nproc)" 2>&1 | tee build.log || true
          echo "---- result ----" | tee -a build.log
          if [ -f uae3DSng.elf ]; then ls -l uae3DSng.elf uae3DSng.3dsx | tee -a build.log; else echo "NO ELF PRODUCED" | tee -a build.log; fi
          echo "errors: $(grep -cE ' error( |:)|undefined reference|\*\*\* \[' build.log || true)" | tee -a build.log

      - name: Resolve crash addresses (tools/crashaddrs.txt)
        if: always()
        run: |
          [ -f uae3DSng.elf ] || exit 0
          P="${DEVKITARM:-/opt/devkitpro/devkitARM}/bin/arm-none-eabi"
          ls "$P-addr2line" || true
          { echo "==== crash address lookup ===="
            grep -v '^#' tools/crashaddrs.txt | while read -r a; do
              [ -n "$a" ] || continue
              echo "--- 0x$a"
              $P-addr2line -f -C -i -e uae3DSng.elf "0x$a" || true
              $P-nm -n -C uae3DSng.elf | grep -i -B2 -A1 "^0*$(printf '%x' $(( (16#$a) & ~0xff )))" | head -8 || true
              lo=$(( (16#$a) - 96 )); hi=$(( (16#$a) + 32 ))
              $P-objdump -d -C --start-address=$lo --stop-address=$hi uae3DSng.elf | tail -n +7
            done
          } 2>&1 | tee crashlookup.log | tee -a build.log || true

      - name: Upload log and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae3DSng-build
          path: |
            build.log
            crashlookup.log
            uae3DSng.elf
            uae3DSng.3dsx
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail if no ELF
        run: test -f uae3DSng.elf
